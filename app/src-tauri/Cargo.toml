[package]
name = "sanhuu-pet"
version = "2.0.0"
description = "三虎桌宠 Sanhuu Pet - 像素风桌面宠物"
authors = ["Sanhuu9009"]
edition = "2021"

[lib]
name = "sanhuu_pet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9"
device_query = "4"
image = { version = "0.25", features = ["png", "gif"] }
base64 = "0.22"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
