<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三虎桌宠</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="topbar" hidden>
  <span id="tbTitle">🐯 三虎桌宠</span>
  <span id="tbSpacer"></span>
  <button id="tbHide" title="隐藏到托盘">—</button>
</div>
<div id="stage">
  <canvas id="pet"></canvas>
  <div id="chip"><span class="dot"></span><span id="petName">三虎桌宠</span><span id="netState"></span></div>
  <div id="hint">点击三虎打开工具栏 · 双击让它跑起来 · 按住拖拽移动</div>
  <div id="bubble"><span id="bubbleText"></span></div>
  <div id="dock"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>
<script src="main.js"></script>
</body>
</html>
