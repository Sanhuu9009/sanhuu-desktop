<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>picker</title>
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden}
canvas{position:fixed;inset:0}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
/* 高亮框窗口：全屏透明、点击穿透，由 Rust picker 驱动画窗口边框 */
const cv=document.getElementById('cv');
function fit(){cv.width=window.innerWidth;cv.height=window.innerHeight;cv.style.width='100%';cv.style.height='100%'}
window.addEventListener('resize',fit);fit();
const ctx=cv.getContext('2d');
function draw(rect){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!rect)return;
  const dpr=window.devicePixelRatio||1;
  const x=rect.x*dpr,y=rect.y*dpr,w=rect.width*dpr,h=rect.height*dpr;
  ctx.strokeStyle='#ff5a4d';ctx.lineWidth=Math.max(2,3*dpr);
  ctx.shadowColor='rgba(255,90,77,.6)';ctx.shadowBlur=10*dpr;
  ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  ctx.shadowBlur=0;
  // 角落把手
  ctx.fillStyle='#ff5a4d';
  const k=10*dpr;
  ctx.fillRect(x-k/2,y-k/2,k,k);ctx.fillRect(x+w-k/2,y-k/2,k,k);
  ctx.fillRect(x-k/2,y+h-k/2,k,k);ctx.fillRect(x+w-k/2,y+h-k/2,k,k);
}
if(window.__TAURI__){
  window.__TAURI__.event.listen('picker-window',e=>draw(e.payload||null));
}else{
  draw({x:100,y:100,width:600,height:400}); // 浏览器预览用
}
</script>
</body>
</html>
