name: build-pyqt

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 Pillow requests pyzipper py7zr imageio imageio-ffmpeg fpdf2 pyinstaller

      # ---------- Windows ----------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name SanhuuPet `
            --icon app_py/icon.ico `
            --add-data "assets/anim;assets/anim" `
            app_py/app.py

      - name: Make installer (Windows NSIS)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p nsis
          cp packaging/installer.nsi nsis/installer.nsi
          sed -i "s/\${VERSION}/$VERSION/g" nsis/installer.nsi
          choco install nsis --yes --no-progress >/dev/null 2>&1 || true
          "/c/Program Files (x86)/NSIS/makensis.exe" nsis/installer.nsi

      # ---------- macOS ----------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --windowed --name "SanhuuPet" \
            --add-data "assets/anim:assets/anim" \
            app_py/app.py

      - name: Make dmg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p icon.iconset
          python - <<'PY'
          from PIL import Image
          im = Image.open("assets/anim/idle/01.png").convert("RGBA").resize((256, 256), Image.Resampling.NEAREST)
          for s in (16, 32, 64, 128, 256, 512):
              im.resize((s, s), Image.Resampling.NEAREST).save(f"icon.iconset/icon_{s}x{s}.png")
              im.resize((s * 2, s * 2), Image.Resampling.NEAREST).save(f"icon.iconset/icon_{s}x{s}@2x.png")
          PY
          iconutil -c icns icon.iconset -o icon.icns
          APP="dist/SanhuuPet.app"
          cp icon.icns "$APP/Contents/Resources/"
          plutil -replace CFBundleIconFile -string icon.icns "$APP/Contents/Info.plist"
          plutil -replace CFBundleName -string "三虎桌宠" "$APP/Contents/Info.plist"
          plutil -replace CFBundleDisplayName -string "三虎桌宠" "$APP/Contents/Info.plist"
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -sf /Applications dmg/Applications
          hdiutil create -volname "SanhuuPet" -srcfolder dmg -ov -format UDZO "Sanhuu.Pet_${VERSION}_aarch64.dmg" -quiet

      # ---------- 发布 ----------
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Sanhuu.Pet-*-setup.exe
            Sanhuu.Pet_*_aarch64.dmg
          generate_release_notes: true
